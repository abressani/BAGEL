dream:
  data_root: /Users/alessandro/Documents/CompAstro/BAGEL/data/      # folder that contains GalaxyMNIST/raw/
  output_dir: /Users/alessandro/Documents/CompAstro/BAGEL/examples   # figures and report; created if missing
  split: train
  epochs: 50
